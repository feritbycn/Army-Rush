name: Test & Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, unit tests, web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (kod kalitesi)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Web build
        run: npm run build

  android:
    name: Build APK (debug) and AAB (release)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (platform 36, build-tools)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Build web assets
        run: npm run build

      - name: Generate launcher icons from assets/
        run: npx --yes @capacitor/assets generate --android --assetPath assets
        continue-on-error: true # simge üretilemezse varsayılan simgeyle devam eder

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Gradle
        run: chmod +x android/gradlew

      # Test/kurulum paketi: debug anahtarıyla imzalanır, Google Play'e YÜKLENEMEZ.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      # İmzalama bilgileri GitHub Secrets'ta ise release imzalanır; yoksa İMZASIZ AAB üretilir.
      - name: Decode keystore (yalnızca secret tanımlıysa)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release AAB
        working-directory: android
        env:
          ARMYRUSH_KEYSTORE: ${{ steps.ks.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ARMYRUSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARMYRUSH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARMYRUSH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Summary
        run: |
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: üretildi (yalnızca test için)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            echo "- Release AAB: **imzalı**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release AAB: **İMZASIZ** (ANDROID_KEYSTORE_* secret'ları tanımlı değil; Play'e yüklenemez)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: army-rush-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: army-rush-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload logs/reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports
            android/**/build/reports
          if-no-files-found: ignore
